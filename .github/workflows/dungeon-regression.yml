name: Dungeon regression checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dungeon-generation:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test dungeon generation and navigation
        run: python tests/test_dungeon_generation.py

      - name: Smoke-test graphics pipeline
        run: python tests/test_visual_rendering.py

      - name: Test mouse coordinate normalization on scaled displays
        run: python tests/test_mouse_coordinates.py

      - name: Test inventory interactions and hotbar
        run: python tests/test_inventory_ui.py

      - name: Test dropped potion bottle rendering
        run: python tests/test_loot_rendering.py

      - name: Test pause menu, fullscreen controls, and live hotbar integration
        run: python tests/test_game_ui_integration.py
